[project]
name = "project_name"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "ipywidgets>=8.1.8,<9",
  "notebook>=7.6.1,<8",
  "pre-commit>=4.6.1,<5",
  "pytest>=9.1,<10",
  "ruff>=0.15.22,<1",
  "ty>=0.0.62,<1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "./ruff.toml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
